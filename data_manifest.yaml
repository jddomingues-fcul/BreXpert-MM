# BreXpert-MM Reconstruction Manifest

pipeline:
  git_commit: 46e791e2d27a45f3a2b7525a9a226eb6b58deaf5
  robust_vqa: true
  lexicon: ACR BI-RADS v2025 (6th edition)
  canvas_order: [width, height]
  canvases:
    mammography: [784, 1120]
    ultrasound: [672, 560]
    mri: [560, 560]
  findings_schema: multi-finding (lesions[], lesion_status, annotation_scope)
  assessment_scopes: [grounded, exam_level, derived]
  split:
    val_frac: 0.10
    test_frac: 0.20
    seed: 42
    frozen_splits: patient_splits.csv
  vqa:
    max_turns: 16
    train:
      context_dropout: 0.5
      shuffle_context: true
      shuffle_questions: true
      add_negative_examples_prob: 0.5
      negative_examples_k: 5
      multiple_choice_prob: 0.25
    validation_and_test:
      eval_preset: true

